<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Fractales & Caos — Javier Galilea</title>
  <meta name="description" content="Explorador interactivo en tiempo real de conjuntos fractales (Mandelbrot, Julia dinámico, Burning Ship y Tricorn) compilado en Rust y WebAssembly por Javier Galilea.">
  <link rel="canonical" href="https://javiergalilea.es/pr_fractales/">
  <meta name="theme-color" content="#06080e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
  <link rel="stylesheet" href="fractales.css">
</head>
<body>
  <!-- Lienzo Fractal a Pantalla Completa -->
  <canvas id="fractalCanvas"></canvas>

  <!-- Barra Superior Flotante -->
  <header class="lab-topbar">
    <div class="topbar-left">
      <a href="../" class="back-btn" title="Volver a la página principal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>javiergalilea.es</span>
      </a>
      <div class="lab-title-group">
        <span class="lab-badge">EXP #05 · GEOMETRÍA FRACTAL</span>
        <h1>Explorador de Fractales</h1>
      </div>
    </div>

    <div class="topbar-right">
      <div class="telemetry-pills">
        <span class="stat-pill">Zoom <strong id="zoomReadout">1.0×</strong></span>
        <span class="stat-pill"><strong id="coordReadout">-0.500 + 0.000i</strong></span>
        <span class="stat-pill"><strong id="fpsCounter">60</strong> FPS</span>
      </div>
      <button id="resetViewBtn" class="action-pill-btn" title="Restablecer encuadre inicial">
        <span>⟲ Vista Inicial</span>
      </button>
      <button id="fullscreenBtn" class="icon-btn" title="Pantalla completa">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
      <button id="toggleHudBtn" class="icon-btn" title="Mostrar/Ocultar controles">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Indicador Flotante Inicial -->
  <div class="canvas-hint" id="canvasHint">
    🔍 Rueda del ratón o doble clic para hacer zoom · Arrastra para explorar · En modo Julia mueve el cursor
  </div>

  <!-- Dock Inferior de Controles -->
  <aside class="hud-dock" id="hudDock">
    <div class="hud-controls">
      <!-- Tipo de Conjunto Fractal -->
      <div class="control-group">
        <label>Conjunto Fractal</label>
        <div class="button-toggle-group">
          <button class="fractal-btn active" data-fractal="mandelbrot" title="Conjunto clásico de Mandelbrot">Mandelbrot</button>
          <button class="fractal-btn" data-fractal="julia" title="Conjunto de Julia modulado en vivo">Julia</button>
          <button class="fractal-btn" data-fractal="ship" title="Fractal Burning Ship">Burning Ship</button>
          <button class="fractal-btn" data-fractal="tricorn" title="Fractal Tricorn / Mandelbar">Tricorn</button>
        </div>
      </div>

      <!-- Viajes Rápidos / Coordenadas Famosas -->
      <div class="control-group">
        <label>Viaje Rápido</label>
        <div class="button-toggle-group">
          <button class="preset-btn" data-preset="seahorse" title="Valle de los Caballitos de Mar">Caballitos</button>
          <button class="preset-btn" data-preset="spiral" title="Espiral de Elefantes">Espiral</button>
          <button class="preset-btn" data-preset="dendrite" title="Julia Dendrita Eléctrica">Dendrita</button>
          <button class="preset-btn" data-preset="armada" title="Flota del Burning Ship">Armada</button>
        </div>
      </div>

      <!-- Dinámica en Vivo -->
      <div class="control-group">
        <label>Modulación</label>
        <div class="button-toggle-group">
          <button id="orbitBtn" class="toggle-btn" title="Animar el parámetro complejo de Julia automáticamente">Órbita Julia</button>
          <button id="cycleColorBtn" class="toggle-btn active" title="Animar el desplazamiento cromático">Ciclo Color</button>
        </div>
      </div>

      <!-- Paleta Cromática -->
      <div class="control-group">
        <label>Paleta Cromática</label>
        <div class="button-toggle-group">
          <button class="palette-btn active" data-palette="cosmos">Cosmos</button>
          <button class="palette-btn" data-palette="cyber">Cyber</button>
          <button class="palette-btn" data-palette="solar">Solar</button>
          <button class="palette-btn" data-palette="emerald">Bio</button>
        </div>
      </div>

      <!-- Profundidad de Iteración -->
      <div class="control-group iter-group">
        <label for="iterSlider">
          <span>Profundidad</span>
          <strong id="iterLabel">120 iter</strong>
        </label>
        <input type="range" id="iterSlider" min="40" max="420" step="10" value="120">
      </div>
    </div>
  </aside>

  <script src="fractales.js"></script>
</body>
</html>
