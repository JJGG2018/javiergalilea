<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio de Ondas & Audio — Javier Galilea</title>
  <meta name="description" content="Laboratorio interactivo de síntesis armónica, ondas de Lissajous y visualización sonora en tiempo real por Javier Galilea.">
  <link rel="canonical" href="https://javiergalilea.es/ondas/">
  <meta name="theme-color" content="#06080e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="stylesheet" href="ondas.css">
</head>
<body>
  <!-- Canvas de Visualización -->
  <canvas id="waveCanvas"></canvas>

  <!-- Barra Superior Flotante -->
  <header class="lab-topbar">
    <div class="topbar-left">
      <a href="../" class="back-btn" title="Volver a la página principal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>javiergalilea.es</span>
      </a>
      <div class="lab-title-group">
        <span class="lab-badge">EXP #03 · SÍNTESIS VISUAL</span>
        <h1>Laboratorio de Ondas</h1>
      </div>
    </div>

    <div class="topbar-right">
      <div class="telemetry-pills">
        <span class="stat-pill"><strong id="audioStatus">Audio: Desactivado</strong></span>
        <span class="stat-pill"><strong id="freqReadout">440.0</strong> Hz</span>
        <span class="stat-pill"><strong id="fpsCounter">60</strong> FPS</span>
      </div>
      <button id="toggleAudioBtn" class="action-pill-btn" title="Activar/Desactivar síntesis acústica">
        <span id="audioBtnText">🔊 Activar Sonido</span>
      </button>
      <button id="fullscreenBtn" class="icon-btn" title="Pantalla completa">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
      <button id="toggleHudBtn" class="icon-btn" title="Mostrar/Ocultar controles">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Hint -->
  <div class="canvas-hint" id="canvasHint">
    🎛️ Desplaza el ratón horizontalmente para modular frecuencia o verticalmente para amplitud
  </div>

  <!-- Dock Inferior de Parámetros -->
  <aside class="hud-dock" id="hudDock">
    <div class="hud-controls">
      <!-- Modo Visualizador -->
      <div class="control-group">
        <label>Modo de Onda</label>
        <div class="button-toggle-group">
          <button class="mode-btn active" data-mode="harmonic">Armónico</button>
          <button class="mode-btn" data-mode="lissajous">Lissajous</button>
          <button class="mode-btn" data-mode="radial">Radial</button>
          <button class="mode-btn" data-mode="interference">Interferencia</button>
        </div>
      </div>

      <!-- Armónicos -->
      <div class="control-group">
        <label for="harmonicsSlider">
          <span>Capas Armónicas</span>
          <strong id="harmonicsLabel">4 capas</strong>
        </label>
        <input type="range" id="harmonicsSlider" min="1" max="10" step="1" value="4">
      </div>

      <!-- Frecuencia Base -->
      <div class="control-group">
        <label for="baseFreqSlider">
          <span>Frecuencia Base</span>
          <strong id="baseFreqLabel">220 Hz</strong>
        </label>
        <input type="range" id="baseFreqSlider" min="55" max="880" step="1" value="220">
      </div>

      <!-- Paleta Cromática -->
      <div class="control-group">
        <label>Paleta</label>
        <div class="button-toggle-group">
          <button class="palette-btn active" data-palette="spectral">Spectral</button>
          <button class="palette-btn" data-palette="synthwave">Synth</button>
          <button class="palette-btn" data-palette="cyan">Cian</button>
          <button class="palette-btn" data-palette="sunset">Sunset</button>
        </div>
      </div>

      <!-- Tipo de oscilador -->
      <div class="control-group">
        <label>Timbre Sintetizador</label>
        <div class="button-toggle-group">
          <button class="wave-type-btn active" data-type="sine">Sine</button>
          <button class="wave-type-btn" data-type="triangle">Tri</button>
          <button class="wave-type-btn" data-type="sawtooth">Saw</button>
        </div>
      </div>
    </div>
  </aside>

  <script src="ondas.js"></script>
</body>
</html>
